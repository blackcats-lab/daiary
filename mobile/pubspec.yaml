name: daiary
description: dAIary — 写真に、言葉を添えて。AIが言葉を添えるフォトダイアリーアプリ
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # ===== State management =====
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^4.0.0

  # ===== Routing =====
  go_router: ^14.2.0

  # ===== Camera / Image =====
  camera: ^0.11.0+1
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  image_cropper: ^12.2.1
  photo_manager: ^3.5.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.4

  # ===== Supabase =====
  supabase_flutter: ^2.5.6

  # ===== Monetization =====
  # google_mobile_ads は Phase 2 で再導入する。
  # 現状入れると AdMob App ID 未設定で起動時に native クラッシュするため除外。
  # 再導入時は AndroidManifest.xml と Info.plist に App ID を追加すること。
  purchases_flutter: ^9.4.0

  # ===== Storage / Models =====
  flutter_secure_storage: ^9.2.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  cached_network_image: ^3.3.1

  # ===== Sharing / Misc =====
  share_plus: ^12.0.0
  flutter_dotenv: ^5.1.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^3.2.3
  json_serializable: ^6.8.0
  riverpod_generator: ^4.0.0+1
  # custom_lint / riverpod_lint は analyzer 7.6 系と
  # custom_lint_visitor の互換問題で一時除外。Phase 1 後半に再評価する。

flutter:
  uses-material-design: true

  assets:
    - .env

  # Playfair Display と Noto Sans JP は google_fonts 経由で取得するため
  # ローカルの fonts/ 同梱はしない。
