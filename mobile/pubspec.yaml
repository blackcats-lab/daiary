name: daiary
description: dAIary — 写真に、言葉を添えて。AIが言葉を添えるフォトダイアリーアプリ
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # ===== State management =====
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ===== Routing =====
  go_router: ^14.2.0

  # ===== Camera / Image =====
  camera: ^0.11.0+1
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  image_cropper: ^7.1.0
  photo_manager: ^3.5.0

  # ===== Supabase =====
  supabase_flutter: ^2.5.6

  # ===== Monetization =====
  google_mobile_ads: ^5.1.0
  purchases_flutter: ^8.11.0

  # ===== Storage / Models =====
  flutter_secure_storage: ^9.2.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  cached_network_image: ^3.3.1

  # ===== Sharing / Misc =====
  share_plus: ^9.0.0
  flutter_dotenv: ^5.1.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  custom_lint: ^0.7.3
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true

  assets:
    - .env

  # Playfair Display と Noto Sans JP は google_fonts 経由で取得するため
  # ローカルの fonts/ 同梱はしない。
