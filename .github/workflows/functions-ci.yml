name: functions-ci

on:
  push:
    branches: [main, develop]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/functions-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/functions-ci.yml"

defaults:
  run:
    working-directory: supabase/functions

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Format check
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Test
        # テストファイルが無い場合はスキップ。Phase 1 以降でテストを追加すれば自動で走る。
        run: |
          if find . -type f \( -name '*_test.ts' -o -name '*.test.ts' \) | grep -q .; then
            deno test --allow-all
          else
            echo "No Deno test files found yet — skipping."
          fi
