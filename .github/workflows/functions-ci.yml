name: functions-ci

on:
  push:
    branches: [main, develop]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/functions-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/functions-ci.yml"

defaults:
  run:
    working-directory: supabase/functions

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Format check
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Test
        run: deno test --allow-all
